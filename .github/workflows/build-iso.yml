name: Build WinUbuntu ISO

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Создать GitHub Release с готовым ISO?'
        required: true
        type: boolean
        default: false
      custom_notes:
        description: 'Краткое описание изменений для релиза (опционально)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Minimal Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Run ISO Build
        run: |
          sudo chmod +x build.sh scripts/*.sh
          sudo ./build.sh

      - name: Upload ISO as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winubuntu-24.04-minimal-iso
          path: |
            output/*.iso
            output/*.sha256
          retention-days: 14

      - name: Prepare Release Metadata
        id: meta
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        run: |
          chmod +x scripts/generate-release-notes.sh
          ./scripts/generate-release-notes.sh "${{ inputs.custom_notes }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v24.04-$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: WinUbuntu 24.04 (${{ steps.meta.outputs.release_tag }})
          draft: false
          prerelease: false
          body_path: release_body.md
          files: |
            output/*.iso
            output/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
