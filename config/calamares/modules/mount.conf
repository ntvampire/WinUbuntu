---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: bind
    - device: /dev/pts
      mountPoint: /dev/pts
      options: bind
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /sys/firmware/efi/efivars
      mountPoint: /sys/firmware/efi/efivars
      options: bind
