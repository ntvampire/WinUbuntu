search --no-floppy --file --set=root /casper/vmlinuz

set default="0"
set timeout=5

# Загрузка видеомодулей для графического экрана GRUB
insmod efi_gop
insmod efi_uga
insmod font
if loadfont /boot/grub/font.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    terminal_input console
    terminal_output gfxterm
fi

menuentry "Установка WinUbuntu 24.04 LTS (Графический установщик)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} quiet splash fsck.mode=skip ---
    initrd /casper/initrd
}

menuentry "Установка WinUbuntu (Безопасный видеорежим / Safe Graphics)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} nomodeset quiet splash fsck.mode=skip ---
    initrd /casper/initrd
}
